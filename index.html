    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

    body::before{ content:''; position:absolute; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(1px); }
    .container{ position:relative; z-index:2; width:100%; height:100vh; display:flex; flex-direction:column; align-items:center; }
    .topbar{ width:100%; display:flex; justify-content:flex-end; align-items:center; padding:18px 25px; gap:18px; }
    .topbar a{ color:white; text-decoration:none; font-size:14px; opacity:0.9; }
    .topbar a:hover{ text-decoration:underline; }
    .icon-btn{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.3s; }
    .icon-btn:hover{ background:rgba(255,255,255,0.15); }
    .profile{ width:38px; height:38px; border-radius:50%; background:#5c6bc0; display:flex; align-items:center; justify-content:center; font-weight:600; cursor:pointer; }
    .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:-60px; }

    .search-box{ width:700px; max-width:90%; height:60px; background:#fff; border-radius:40px; display:flex; align-items:center; padding:0 20px; box-shadow:0 5px 20px rgba(0,0,0,0.25); }
    .search-icon{ font-size:20px; color:#777; margin-right:15px; }
    .search-box input{ flex:1; border:none; outline:none; font-size:18px; color:#333; background:transparent; }
    .search-actions{ display:flex; align-items:center; gap:18px; color:#555; font-size:18px; }
    .ai-btn{ background:#f1f3f4; padding:10px 18px; border-radius:25px; font-size:15px; font-weight:500; cursor:pointer; transition:0.3s; }
    .ai-btn:hover{ background:#e2e5e7; }
    .shortcuts{ margin-top:35px; display:flex; gap:35px; flex-wrap:wrap; justify-content:center; max-width:1000px; }
    .shortcut{ display:flex; flex-direction:column; align-items:center; cursor:pointer; color:white; }
    .shortcut-circle{ width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:10px; transition:0.3s; border:1px solid rgba(255,255,255,0.08); }
    .shortcut:hover .shortcut-circle{ transform:translateY(-4px); background:rgba(255,255,255,0.12); }
    .shortcut span{ font-size:14px; text-align:center; max-width:90px; }
    .edit-btn{ position:absolute; right:20px; bottom:20px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.15); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.3s; z-index:5; }
    @media(max-width:768px){ .logo{ font-size:60px; } .search-box{ height:55px; } .shortcuts{ gap:20px; } .shortcut-circle{ width:55px; height:55px; } }
  </style>
